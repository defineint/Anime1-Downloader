version: '3.8'

services:
  # 前端網頁與對外入口
  frontend:
    image: ghcr.io/defineint/anime1-downloader-frontend:latest
    ports:
      - "5173:80"  
    depends_on:
      - backend
    networks:
      - anime_net
    restart: unless-stopped

  # FastAPI 後端
  backend:
    image: ghcr.io/defineint/anime1-downloader-backend:latest
    environment:
      - SELENIUM_URL=http://selenium-chrome:4444/wd/hub 
      - DOWNLOAD_ROOT=/downloads                        
    volumes:
      - ${ANIME_DOWNLOAD_PATH:-./downloads}:/downloads
    depends_on:
      - selenium-chrome
    networks:
      - anime_net
    restart: unless-stopped

  # Google Chrome 側車
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - anime_net
    restart: unless-stopped

networks:
  anime_net:
    driver: bridge